---
layout: default
---

<div class="zen-home">
  <section class="zen-about" aria-labelledby="about-title">
    <div class="zen-portrait">
      {% assign profile_image_path = page.profile.image | prepend: 'assets/img/' %}
      <figure>
        <div class="zen-portrait-frame">
          <img src="{{ profile_image_path | relative_url | bust_file_cache }}" alt="Shashank Singh" width="824" height="906">
        </div>
        <figcaption class="caption">{{ page.profile.caption }}</figcaption>
      </figure>
    </div>

    <div class="zen-about-copy">
      <p class="zen-eyebrow">About</p>
      <h1 id="about-title">{{ page.intro }}</h1>
      <div class="zen-about-text">{{ content }}</div>
      <a class="zen-text-link" href="{{ '/assets/pdf/shashank_cv.pdf' | relative_url }}">
        Read my CV
        <svg class="zen-link-arrow" aria-hidden="true" viewBox="0 0 12 12">
          <path d="M3 9 9 3M4 3h5v5" />
        </svg>
      </a>
    </div>
  </section>

  {% if page.selected_papers %}
  <section class="zen-research" id="research" aria-labelledby="research-title">
    <h2 id="research-title">Research</h2>
    {% include selected_papers.html %}
  </section>
  {% endif %}
</div>
