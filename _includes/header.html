<header class="zen-site-header">
  <nav class="container" aria-label="Primary navigation">
    <div class="zen-brand">
      <a class="zen-wordmark" href="{{ '/' | relative_url }}">{{ site.first_name }} {{ site.last_name }}</a>
      <div class="zen-institution-seals" aria-label="Academic affiliations">
        <a href="https://www.berkeley.edu/" target="_blank" rel="noopener noreferrer" aria-label="University of California, Berkeley">
          <img src="{{ '/assets/img/berkeley_logo.png' | relative_url }}" alt="" width="64" height="64">
        </a>
        <a href="https://www.uchicago.edu/" target="_blank" rel="noopener noreferrer" aria-label="University of Chicago">
          <img src="{{ '/assets/img/uchicago_seal.png' | relative_url }}" alt="" width="128" height="128">
        </a>
        <a href="https://www.iitkgp.ac.in/" target="_blank" rel="noopener noreferrer" aria-label="Indian Institute of Technology Kharagpur">
          <img src="{{ '/assets/img/iitkgp_seal.svg' | relative_url }}" alt="" width="268" height="300">
        </a>
      </div>
    </div>
    <div class="zen-nav-links">
      <a class="zen-about-link" href="{{ '/' | relative_url }}">About</a>
      <a href="{{ '/research/' | relative_url }}">Research</a>
      <a href="{{ '/assets/pdf/shashank_cv.pdf' | relative_url }}">CV</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      {% if site.enable_darkmode %}
      <button id="light-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
        <i class="fa-solid fa-sun" aria-hidden="true"></i>
      </button>
      {% endif %}
    </div>
  </nav>
</header>
