<header class="zen-site-header">
  <nav class="container" aria-label="Primary navigation">
    <a class="zen-wordmark" href="{{ '/' | relative_url }}">{{ site.first_name }} {{ site.last_name }}</a>
    <div class="zen-nav-links">
      <a class="zen-about-link" href="{{ '/' | relative_url }}">About</a>
      <a href="{{ '/research/' | relative_url }}">Research</a>
      <a href="{{ '/assets/pdf/shashank_cv.pdf' | relative_url }}">CV</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      {% if site.enable_darkmode %}
      <button id="light-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
        <i class="fa-solid fa-sun" aria-hidden="true"></i>
      </button>
      {% endif %}
    </div>
  </nav>
</header>
